name: Deploy site to GitHub Pages

# Publishes the landing page at https://nolsoopgames.com/ and the web game under
# /abysspet/, while keeping the source tree at the repo root (so sprite/build
# scripts stay unchanged).
#
# 주의: _site 에 명시적으로 복사한 것만 배포된다. 저장소에 파일을 두는 것만으로는
# 라이브에 뜨지 않는다. ads.txt·파비콘이 404였던 원인이 이것이었다.
# One-time setup: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site with game under /abysspet/
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/abysspet

          # Game runtime (relative paths resolve under /abysspet/)
          cp index.html _site/abysspet/index.html
          cp privacy.html _site/abysspet/privacy.html
          cp terms-of-service.html _site/abysspet/terms-of-service.html
          cp -R css _site/abysspet/css
          cp -R js _site/abysspet/js
          mkdir -p _site/abysspet/assets
          cp -R assets/sprites _site/abysspet/assets/sprites

          # 아이콘 — index.html 이 참조하는 경로 그대로 (없으면 파비콘이 404)
          cp favicon.ico _site/abysspet/favicon.ico
          cp manifest.webmanifest _site/abysspet/manifest.webmanifest
          cp -R assets/brand-icon _site/abysspet/assets/brand-icon
          cp -R assets/app-icon _site/abysspet/assets/app-icon
          # App logo referenced by granite.config.ts icon URL
          [ -d assets/ait-store ] && cp -R assets/ait-store _site/abysspet/assets/ait-store

          if [ -d notion ]; then
          mkdir -p _site/notion
          cp -R notion/. _site/notion/
          touch _site/notion/.nojekyll
          fi

          # Disable Jekyll processing (keeps files starting with _ etc.)
          touch _site/.nojekyll _site/abysspet/.nojekyll

          # Custom domain
          cp CNAME _site/CNAME

          # 루트 랜딩 페이지 + 루트에서 참조하는 아이콘
          mkdir -p _site/assets
          cp home/index.html _site/index.html
          cp favicon.ico _site/favicon.ico
          cp -R assets/brand-icon _site/assets/brand-icon
          cp -R assets/app-icon _site/assets/app-icon

          # 판매자 인증 — 루트 도메인에만 두어야 유효하다.
          # ads.txt 는 웹 애드센스, app-ads.txt 는 Play 앱 AdMob 용.
          cp ads.txt _site/ads.txt
          cp app-ads.txt _site/app-ads.txt

          # 구 URL만 정규 주소로 넘긴다. 루트는 랜딩 페이지이므로 리다이렉트하지 않는다.
          make_redirect() {
            target="$1"; out="$2"
            printf '<!DOCTYPE html>\n<html lang="ko"><head><meta charset="UTF-8">\n<link rel="canonical" href="%s">\n<meta http-equiv="refresh" content="0; url=%s">\n<script>location.replace("%s");</script>\n</head><body><p><a href="%s">%s</a></p></body></html>\n' "$target" "$target" "$target" "$target" "$target" > "$out"
          }
          make_redirect "https://nolsoopgames.com/abysspet/privacy.html" _site/privacy.html
          make_redirect "https://nolsoopgames.com/abysspet/terms-of-service.html" _site/terms-of-service.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
