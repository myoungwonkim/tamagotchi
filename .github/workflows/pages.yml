name: Deploy site to GitHub Pages

# Publishes the studio site at https://nolsoopgames.com/.
# The playable game is on Cloudflare (https://abysspet.nolsoopgames.com/).
# Do not copy the game SPA onto this host: AdSense reviews the root domain
# and treats a near-empty canvas + ads as low-value content.
#
# 주의: _site 에 명시적으로 복사한 것만 배포된다. 저장소에 파일을 두는 것만으로는
# 라이브에 뜨지 않는다. ads.txt·파비콘이 404였던 원인이 이것이었다.
# One-time setup: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble studio site for GitHub Pages
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/abysspet _site/assets

          make_redirect() {
            target="$1"; out="$2"
            printf '<!DOCTYPE html>\n<html lang="ko"><head><meta charset="UTF-8">\n<title>Moved</title>\n<link rel="canonical" href="%s">\n<meta http-equiv="refresh" content="0; url=%s">\n<meta name="robots" content="noindex,follow">\n<script>location.replace("%s");</script>\n</head><body><p><a href="%s">%s</a></p></body></html>\n' "$target" "$target" "$target" "$target" "$target" > "$out"
          }

          # 게임 정본은 Cloudflare(abysspet.nolsoopgames.com).
          # 이 호스트에 게임 SPA를 올리면 크롤러가 글자 거의 없는 페이지+AdSense를 보고
          # 루트 도메인을 «가치가 별로 없는 콘텐츠»로 본다.
          make_redirect "https://abysspet.nolsoopgames.com/" _site/abysspet/index.html
          make_redirect "https://abysspet.nolsoopgames.com/privacy.html" _site/abysspet/privacy.html
          make_redirect "https://abysspet.nolsoopgames.com/terms-of-service.html" _site/abysspet/terms-of-service.html

          if [ -d notion ]; then
            mkdir -p _site/notion
            cp -R notion/. _site/notion/
            touch _site/notion/.nojekyll
          fi

          touch _site/.nojekyll _site/abysspet/.nojekyll
          cp CNAME _site/CNAME

          cp home/index.html _site/index.html
          cp home/about.html _site/about.html
          cp home/contact.html _site/contact.html
          cp home/privacy.html _site/privacy.html
          cp home/terms.html _site/terms.html
          cp home/terms.html _site/terms-of-service.html
          cp home/robots.txt _site/robots.txt
          cp home/sitemap.xml _site/sitemap.xml
          cp home/pages.css _site/pages.css
          cp favicon.ico _site/favicon.ico
          cp -R assets/brand-icon _site/assets/brand-icon
          cp -R assets/app-icon _site/assets/app-icon

          cp ads.txt _site/ads.txt
          cp app-ads.txt _site/app-ads.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
