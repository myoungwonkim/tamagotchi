<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앱 아이콘 시안 (인면어)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:28px 20px 64px; background:#0e1620; color:#e8f0f7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:1.4rem; margin:0 0 6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tag { font-size:.62rem; font-weight:800; letter-spacing:.06em; background:#ff5470; color:#1a0008;
    padding:3px 8px; border-radius:999px; }
  .sub { color:#93a7b8; margin:0 0 28px; font-size:.9rem; line-height:1.55; max-width:820px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; max-width:1180px; margin:0 auto; }
  .card { background:#16212e; border:1px solid #24333f; border-radius:16px; padding:18px; }
  .card h2 { margin:0 0 2px; font-size:1.05rem; }
  .card .desc { color:#8aa; font-size:.76rem; margin-bottom:12px; }
  .heros { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hcell .lab { font-size:.68rem; color:#9fb4c4; margin-bottom:6px; text-align:center; }
  .hcell .lab b { color:#6fd3ff; }
  .hero { border-radius:16px; overflow:hidden; border:1px solid #26333d; aspect-ratio:1/1; }
  .hero img { width:100%; height:100%; display:block; image-rendering:pixelated; }
  .home { margin-top:16px; padding:14px 10px; background:linear-gradient(160deg,#1b3a4a,#0f2230);
    border-radius:12px; }
  .home .htitle { font-size:.66rem; color:#9fb4c4; text-align:center; margin-bottom:12px; }
  .row { display:flex; gap:16px; align-items:flex-end; justify-content:center; }
  .app { text-align:center; }
  .app .ico { border-radius:27px; overflow:hidden; box-shadow:0 6px 14px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.06); width:120px; height:120px; }
  .app.s60 .ico { width:60px; height:60px; border-radius:14px; }
  .app .ico img { width:100%; height:100%; image-rendering:pixelated; }
  .app .cap { margin-top:8px; font-size:.66rem; color:#c7d8e6; }
  .app .cap b { color:#6fd3ff; }
  @media (max-width:900px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
  <h1>앱 아이콘 시안 <span class="tag">STAGING ONLY</span></h1>
  <p class="sub">
    <b>인면어</b>(<code>assets/sprites/adult/plain.png</code>) 기반 앱 아이콘 3종 — 모두 진행.
    각 시안마다 <b>표준(전신)</b>과 <b>소형용(얼굴 확대)</b> 두 버전을 제공합니다.
    아래 홈 화면 시뮬레이션에서 60px 표준 vs 소형을 비교하세요(소형이 작은 크기에서 얼굴이 더 잘 보입니다).
    게임 미반영 · 커밋 없음.
  </p>

  <div class="grid" id="root"></div>

  <script>
    const V = "appicon2";
    const SETS = [
      { n:1, ko:"시안 1 · 심해 어둠", en:"abyssal dark + bioluminescence" },
      { n:2, ko:"시안 2 · 밝은 팝",   en:"bright cyan spotlight, store-pop" },
      { n:3, ko:"시안 3 · 잠수함 창",  en:"brass porthole emblem" },
    ];
    const root = document.getElementById("root");
    for (const s of SETS) {
      const std = `../assets/custom/app-icon-${s.n}.png?v=${V}`;
      const sml = `../assets/custom/app-icon-${s.n}-small.png?v=${V}`;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h2>${s.ko}</h2>
        <div class="desc">${s.en}</div>
        <div class="heros">
          <div class="hcell"><div class="lab">표준 <b>(전신)</b></div><div class="hero"><img src="${std}"></div></div>
          <div class="hcell"><div class="lab">소형용 <b>(얼굴 확대)</b></div><div class="hero"><img src="${sml}"></div></div>
        </div>
        <div class="home">
          <div class="htitle">홈 화면 크기 비교</div>
          <div class="row">
            <div class="app"><div class="ico"><img src="${sml}"></div><div class="cap">120px · <b>소형용</b></div></div>
            <div class="app s60"><div class="ico"><img src="${std}"></div><div class="cap">60px · 표준</div></div>
            <div class="app s60"><div class="ico"><img src="${sml}"></div><div class="cap">60px · <b>소형용</b></div></div>
          </div>
        </div>`;
      root.appendChild(card);
    }
  </script>
</body>
</html>
