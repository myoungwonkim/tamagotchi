apply plugin: 'com.android.application'

android {
    namespace "com.nolsoopgames.abysspet"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "com.nolsoopgames.abysspet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 29
        versionName "1.0.25"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file("../keystore.properties")
            if (keystorePropsFile.exists()) {
                def keystoreProps = new Properties()
                keystoreProps.load(new FileInputStream(keystorePropsFile))
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            if (rootProject.file("../keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.firebase:firebase-analytics:23.0.0"
    implementation "com.google.android.gms:play-services-ads:25.4.+"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Crashlytics needs the google-services config; applying it without the
        // file fails the build, so both stay inside this guard.
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied. Firebase Analytics/Crashlytics will not run.")
}

def servicesFile = file('google-services.json')
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } && (!servicesFile.exists() || !servicesFile.text.trim())) {
    throw new GradleException("android/app/google-services.json is required for release. Without it Play installs never reach Firebase Analytics.")
}

def mergedNativeLibsDir = layout.buildDirectory.dir("intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib")
def shrinkAab = layout.buildDirectory.file("intermediates/intermediary_bundle/release/shrinkBundleReleaseResources/intermediary-bundle.aab")
def injectScript = rootProject.file("../scripts/inject_aab_native_symbols.py")

tasks.register("zipReleaseNativeDebugSymbols", Zip) {
    from(mergedNativeLibsDir)
    archiveFileName = "native-debug-symbols.zip"
    destinationDirectory = layout.buildDirectory.dir("outputs/native-debug-symbols/release")
}

tasks.register("injectReleaseNativeDebugSymbols") {
    dependsOn("shrinkBundleReleaseResources")
    doLast {
        exec {
            commandLine "python3", injectScript.absolutePath, shrinkAab.get().asFile.absolutePath, mergedNativeLibsDir.get().asFile.absolutePath
        }
    }
}

afterEvaluate {
    tasks.named("signReleaseBundle").configure { dependsOn("injectReleaseNativeDebugSymbols") }
    tasks.named("bundleRelease").configure { finalizedBy("zipReleaseNativeDebugSymbols") }
}
